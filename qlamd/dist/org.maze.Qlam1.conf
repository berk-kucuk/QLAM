<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.maze.Qlam1"/>
    <allow send_destination="org.maze.Qlam1"/>
  </policy>
  <!-- Anyone may call; the daemon checks the caller's uid and polkit per method. -->
  <policy context="default">
    <allow send_destination="org.maze.Qlam1" send_interface="org.maze.Qlam1"/>
    <allow send_destination="org.maze.Qlam1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.maze.Qlam1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.maze.Qlam1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
