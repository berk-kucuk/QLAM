[package]
name = "qlamd"
version = "2.1.0"
edition = "2021"
description = "Qlam on-access antivirus daemon"
license = "MIT"
rust-version = "1.85"

[dependencies]
arc-swap = "1.9"
bzip2 = "0.6"
crossbeam-channel = "0.5"
flate2 = "1.1"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
log = "0.4"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
regex = "1.13"
ruzstd = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
toml = "1.1"
ureq = "3.4"
uuid = { version = "1.26", features = ["v4"] }
yara-x = "1.21"
zbus = "5.19"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Tests build archives to walk.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
