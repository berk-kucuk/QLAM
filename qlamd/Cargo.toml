[package]
name = "qlamd"
version = "2.0.1"
edition = "2021"
description = "Qlam on-access antivirus daemon"
license = "MIT"
rust-version = "1.85"

[dependencies]
arc-swap = "1.9"
crossbeam-channel = "0.5"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
log = "0.4"
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
ureq = "3.4"
uuid = { version = "1.26", features = ["v4"] }
yara-x = "1.21"
zbus = "5.19"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
